name: Actualizar datos de Jira

on:
  schedule:
    - cron: '0 */6 * * *'       # cada 6 horas
  workflow_dispatch:             # disparo manual desde la UI

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch datos de Jira
        env:
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: node fetch-data.js

      - name: Commit y push data.json (solo si cambió)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Sin cambios en data.json"
          else
            git commit -m "chore: actualizar data.json [skip ci]"
            git push
          fi
